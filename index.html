<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arya Salem — code, climate data, and quartet strings</title>
    <meta
      name="description"
      content="Personal site of Arya Salem: a high school developer building club websites, climate trackers, and ecosystem simulations — and playing in a string quartet on the side."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5f2ea'/%3E%3Crect width='64' height='64' rx='14' fill='none' stroke='%23c9c2b2' stroke-width='2'/%3E%3Ctext x='32' y='44' font-family='monospace' font-size='32' font-weight='700' fill='%231c2534' text-anchor='middle'%3Ea.%3C/text%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (error) {
          /* default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
